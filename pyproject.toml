[project]
name = "lang-chain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "A.Vimanthan", email = "viman.workspace@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.6",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
lang-chain = "lang_chain:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
